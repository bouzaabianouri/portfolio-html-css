version: "3.9"

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    environment:
      - API_PORT=4000
      - MONGO_URI=mongodb://mongo:27017/smartbus
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me
    depends_on:
      - mongo
      - redis

  simulator:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./simulator:/app
    command: sh -c "npm install && npm run sim"
    environment:
      - INGESTION_URL=http://backend:4000/api/ingest/location
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
